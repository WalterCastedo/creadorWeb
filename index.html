<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreadorWeb Pro v6 - Studio con Menú Hamburguesa Móvil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden"
  >
    <!-- Header / Barra Superior -->
    <header
      class="bg-slate-800/95 backdrop-blur-md border-b border-slate-700 px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-3 sticky top-0 z-50"
    >
      <div class="flex items-center gap-3">
        <div
          class="bg-gradient-to-tr from-emerald-500 via-teal-400 to-cyan-500 text-slate-950 p-2.5 rounded-xl font-black text-xl shadow-lg shadow-emerald-500/20"
        >
          <i class="fa-solid fa-gem"></i>
        </div>
        <div>
          <h1
            class="text-lg sm:text-xl font-extrabold tracking-tight flex items-center gap-2"
          >
            CreadorWeb Pro
            <span
              class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
              >v6 Studio</span
            >
          </h1>
          <p class="text-[11px] sm:text-xs text-slate-400 hidden sm:block">
            Menú Hamburguesa Móvil + Íconos FontAwesome 6 + Pestañas Móviles
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Selector de Pestañas para Móvil -->
        <div
          class="lg:hidden flex bg-slate-900 p-1 rounded-xl border border-slate-700"
        >
          <button
            type="button"
            id="tabEditor"
            class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 flex items-center gap-1.5 transition-all"
          >
            <i class="fa-solid fa-pen-to-square"></i> Editor
          </button>
          <button
            type="button"
            id="tabPreview"
            class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1.5 transition-all"
          >
            <i class="fa-solid fa-eye"></i> Preview
          </button>
        </div>

        <button
          id="btnExport"
          class="hidden bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black px-4 sm:px-6 py-2.5 rounded-xl shadow-lg transition-all items-center gap-2 text-xs sm:text-sm"
        >
          <i class="fa-solid fa-file-arrow-down text-base"></i>
          <span class="hidden sm:inline">Descargar</span> index.html
        </button>
      </div>
    </header>

    <!-- Layout Principal de Contenido -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-h-0 relative">
      <!-- Panel 1: Editor -->
      <section
        id="panelEditor"
        class="lg:col-span-5 bg-slate-800/40 p-4 sm:p-6 border-r border-slate-700/80 overflow-y-auto max-h-[calc(100vh-65px)] space-y-6 block"
      >
        <form
          id="builderForm"
          onsubmit="event.preventDefault()"
          class="space-y-6"
        >
          <!-- Identidad y Menú Navbar -->
          <div
            class="bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-700/80 space-y-4"
          >
            <h2
              class="text-xs font-extrabold uppercase text-emerald-400 flex items-center gap-2"
            >
              <i class="fa-solid fa-compass"></i> Menú Superior (Navbar)
            </h2>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Nombre del Negocio / Marca</label
              >
              <input
                type="text"
                id="nombre"
                value="Napoletana Gourmet"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
              />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1"
                  >Categoría</label
                >
                <input
                  type="text"
                  id="categoria"
                  value="Pizzería Artesanal"
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1"
                  >Teléfono / WhatsApp</label
                >
                <input
                  type="text"
                  id="telefono"
                  value="+591 70000000"
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                />
              </div>
            </div>

            <!-- Botón Navbar e Ícono -->
            <div class="space-y-2 pt-2 border-t border-slate-700/60">
              <label class="block text-xs font-semibold text-slate-300"
                >Botón de Menú (CTA Navbar)</label
              >
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <input
                  type="color"
                  id="btnNavColor"
                  value="#10b981"
                  class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer"
                />
                <input
                  type="text"
                  id="btnNavText"
                  value="Pedir por WhatsApp"
                  class="sm:col-span-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                />
              </div>
              <div>
                <label
                  class="block text-[10px] font-semibold text-slate-400 mb-1"
                  >Ícono del Botón del Menú</label
                >
                <select
                  id="btnNavIcon"
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                >
                  <option value="fa-brands fa-whatsapp">
                    WhatsApp (Logo Verde)
                  </option>
                  <option value="fa-solid fa-phone">Teléfono (Llamada)</option>
                  <option value="fa-solid fa-cart-shopping">
                    Carrito de Compras
                  </option>
                  <option value="fa-solid fa-star">Estrella</option>
                  <option value="none">Sin Ícono</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Portada (Hero) -->
          <div
            class="bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-700/80 space-y-4"
          >
            <h2
              class="text-xs font-extrabold uppercase text-emerald-400 flex items-center gap-2"
            >
              <i class="fa-solid fa-align-center"></i> Portada (Hero) & Posición
            </h2>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Título Principal</label
              >
              <input
                type="text"
                id="tituloHero"
                value="La Auténtica Pizza Napolitana al Horno de Leña"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Subtítulo / Descripción</label
              >
              <textarea
                id="descripcion"
                rows="2"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
              >
Masa madre madurada 48 horas e ingredientes italianos.</textarea
              >
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1"
                  >Alineación Texto</label
                >
                <select
                  id="heroAlign"
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                >
                  <option value="center">Centrado</option>
                  <option value="left">Izquierda</option>
                  <option value="right">Derecha</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1"
                  >Posición Botones</label
                >
                <select
                  id="btnAlign"
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                >
                  <option value="justify-center">Centro</option>
                  <option value="justify-start">Izquierda</option>
                  <option value="justify-end">Derecha</option>
                </select>
              </div>
            </div>

            <!-- Botón 1 Hero -->
            <div class="space-y-2 pt-2 border-t border-slate-700/60">
              <span class="text-[11px] font-bold text-slate-400 uppercase block"
                >Botón Principal (CTA 1)</span
              >
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <input
                  type="color"
                  id="btnHero1Color"
                  value="#e11d48"
                  class="w-full h-8 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer"
                />
                <input
                  type="text"
                  id="btnHero1Text"
                  value="Ordenar Ahora"
                  class="sm:col-span-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
                />
              </div>
              <select
                id="btnHero1Icon"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
              >
                <option value="fa-solid fa-fire">Fuego / Oferta</option>
                <option value="fa-brands fa-whatsapp">WhatsApp</option>
                <option value="fa-solid fa-bag-shopping">
                  Bolsa de Compras
                </option>
                <option value="none">Sin Ícono</option>
              </select>
            </div>

            <!-- Botón 2 Hero -->
            <div class="space-y-2 pt-2 border-t border-slate-700/60">
              <span class="text-[11px] font-bold text-slate-400 uppercase block"
                >Botón Secundario (CTA 2)</span
              >
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <input
                  type="color"
                  id="btnHero2Color"
                  value="#334155"
                  class="w-full h-8 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer"
                />
                <input
                  type="text"
                  id="btnHero2Text"
                  value="Ver Servicios"
                  class="sm:col-span-2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
                />
              </div>
              <select
                id="btnHero2Icon"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
              >
                <option value="fa-solid fa-chevron-down">Flecha Abajo</option>
                <option value="fa-solid fa-list">Lista</option>
                <option value="none">Sin Ícono</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Imagen de Fondo</label
              >
              <div class="flex gap-2">
                <input
                  type="text"
                  id="heroBgUrl"
                  value="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1200&q=80"
                  class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                />
                <label
                  class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-xl cursor-pointer flex items-center gap-1.5"
                >
                  <i class="fa-solid fa-upload"></i>
                  <input
                    type="file"
                    id="heroBgFile"
                    accept="image/*"
                    class="hidden"
                  />
                </label>
              </div>
            </div>
          </div>

          <!-- Estilos -->
          <div
            class="bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-700/80 space-y-4"
          >
            <h2
              class="text-xs font-extrabold uppercase text-emerald-400 flex items-center gap-2"
            >
              <i class="fa-solid fa-palette"></i> Estilos Visuales
            </h2>
            <div class="grid grid-cols-3 gap-3">
              <div>
                <label
                  class="block text-[10px] font-semibold text-slate-300 mb-1"
                  >Acentos</label
                >
                <input
                  type="color"
                  id="colorPrimary"
                  value="#e11d48"
                  class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer"
                />
              </div>
              <div>
                <label
                  class="block text-[10px] font-semibold text-slate-300 mb-1"
                  >Título Hero</label
                >
                <input
                  type="color"
                  id="colorTitle"
                  value="#ffffff"
                  class="w-full h-9 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer"
                />
              </div>
              <div>
                <label
                  class="block text-[10px] font-semibold text-slate-300 mb-1"
                  >Animación</label
                >
                <select
                  id="animationType"
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white"
                >
                  <option value="zoom">Zoom Suave</option>
                  <option value="lift">Elevación</option>
                  <option value="glow">Brillo Neón</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Servicios -->
          <div
            class="bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-700/80 space-y-4"
          >
            <div class="flex items-center justify-between">
              <h2
                class="text-xs font-extrabold uppercase text-emerald-400 flex items-center gap-2"
              >
                <i class="fa-solid fa-layer-group"></i> Tarjetas de Servicios
              </h2>
              <button
                id="btnAddService"
                type="button"
                class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-2.5 py-1 rounded-lg"
              >
                + Añadir
              </button>
            </div>
            <div id="servicesContainer" class="space-y-4"></div>
          </div>

          <!-- Ubicación -->
          <div
            class="bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-700/80 space-y-4"
          >
            <h2
              class="text-xs font-extrabold uppercase text-emerald-400 flex items-center gap-2"
            >
              <i class="fa-solid fa-map-location-dot"></i> Ubicación y Mapa
            </h2>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Dirección Escrita</label
              >
              <input
                type="text"
                id="ubicacion"
                value="Av. Monseñor Rivero #450, Santa Cruz, Bolivia"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1"
                >Google Maps Búsqueda</label
              >
              <input
                type="text"
                id="mapQuery"
                value="Santa Cruz de la Sierra, Bolivia"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white"
              />
            </div>
          </div>
        </form>
      </section>

      <!-- Panel 2: Previsualizador -->
      <section
        id="panelPreview"
        class="hidden lg:flex lg:col-span-7 bg-slate-950 p-3 sm:p-6 flex-col items-center overflow-y-auto max-h-[calc(100vh-65px)] w-full"
      >
        <div
          class="w-full max-w-5xl bg-slate-800 px-4 py-3 rounded-t-2xl border border-slate-700 border-b-0 flex flex-wrap items-center justify-between gap-3 text-xs"
        >
          <span
            class="font-mono text-slate-300 font-bold hidden sm:inline-block"
            ><i class="fa-solid fa-desktop"></i> Vista Previa Interactiva</span
          >

          <div
            class="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-700/80 gap-1"
          >
            <button
              type="button"
              data-view="desktop"
              class="btnViewMode px-3 py-1 rounded-lg text-xs font-bold text-white bg-slate-700 flex items-center gap-1.5"
            >
              <i class="fa-solid fa-desktop"></i>
              <span class="hidden sm:inline">PC</span>
            </button>
            <button
              type="button"
              data-view="tablet"
              class="btnViewMode px-3 py-1 rounded-lg text-xs font-bold text-slate-400 flex items-center gap-1.5"
            >
              <i class="fa-solid fa-tablet-screen-button"></i>
              <span class="hidden sm:inline">Tablet</span>
            </button>
            <button
              type="button"
              data-view="mobile"
              class="btnViewMode px-3 py-1 rounded-lg text-xs font-bold text-slate-400 flex items-center gap-1.5"
            >
              <i class="fa-solid fa-mobile-screen-button"></i>
              <span class="hidden sm:inline">Móvil</span>
            </button>
          </div>
        </div>

        <div
          id="previewWrapper"
          class="w-full max-w-5xl h-[650px] lg:h-full bg-slate-900 rounded-b-2xl border border-slate-800 overflow-hidden shadow-2xl transition-all duration-300 flex justify-center"
        >
          <iframe
            id="previewFrame"
            class="w-full h-full border-0 bg-white transition-all duration-300"
          ></iframe>
        </div>
      </section>
    </main>

    <script src="js/generator.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
